[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tenon-pi-client"
version = "0.3.0a1"
description = "Python SDK and CLI for the Tenon Pi managed robot-learning lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DexGEM-Lab" }]
keywords = ["robotics", "openpi", "vla"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "msgpack>=1.1,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
libero = [
  "lerobot[dataset]==0.6.1; python_version >= '3.12'",
  "pillow>=10,<13",
  "pyarrow>=18,<24",
]
data = [
  "pillow>=10,<13",
  "pyarrow>=18,<24",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.23,<5",
  "mypy>=1.15",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pyarrow>=18,<24",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.scripts]
tenon-pi = "tenon_pi.cli:main"

[project.urls]
Documentation = "https://github.com/DexGEM-Lab/tenon-pi-client#readme"
Repository = "https://github.com/DexGEM-Lab/tenon-pi-client"

[tool.hatch.build.targets.wheel]
packages = ["src/tenon_pi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tenon_pi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
